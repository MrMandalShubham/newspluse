# Local dev stack. On DigitalOcean, `db` is replaced by Managed Postgres
# (point DATABASE_URL at it) — the api service stays the same.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Live-reload source during dev.
    volumes:
      - ./src:/app/src
    command: uvicorn newspulse.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: newspulse
      POSTGRES_PASSWORD: newspulse
      POSTGRES_DB: newspulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newspulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
