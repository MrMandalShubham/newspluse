# NewsPulse source registry — adding a source is CONFIG, not code.
#
# Per source:
#   key            stable identifier (slug)
#   name           display name (unique; used to link raw_items -> sources)
#   url            site base URL
#   region         ISO-ish region hint (optional)
#   type           news | retail | reg
#   trust_score    0..1, weights this source in trend scoring
#   section_filter substring/regex kept from discovered URLs (e.g. beauty section)
#   discovery.method   sitemap | rss | htmlcrawl
#   extraction.method  jsonld | readability   (runs on the fetched article HTML)

sources:
  - key: theestablished
    name: The Established
    url: https://www.theestablished.com
    region: IN
    type: news
    trust_score: 0.5
    section_filter: "/self/beauty/"
    discovery:
      method: sitemap
      news_sitemap: /news-sitemap.xml
      index_sitemap: /webcontent-sitemap.xml
    extraction:
      method: jsonld

  - key: thenodmag
    name: The Nod Mag
    url: https://thenodmag.com
    region: IN
    type: news
    trust_score: 0.5
    # Articles live at /content/<slug>; the beauty section page lists them.
    discovery:
      method: htmlcrawl
      list_pages: ["/beauty-and-wellbeing"]
      link_pattern: "/content/"
    extraction:
      method: jsonld

  - key: harpersbazaar
    name: Harper's Bazaar India
    url: https://www.harpersbazaar.in
    region: IN
    type: news
    trust_score: 0.6
    section_filter: "/beauty/"
    discovery:
      method: sitemap
      news_sitemap: /news-sitemap.xml
    extraction:
      method: jsonld

  # --- JS-rendered (SPA) sources: render with a headless browser first ---
  - key: vogue
    name: Vogue India
    url: https://www.vogue.in
    region: IN
    type: news
    trust_score: 0.6
    render: playwright
    max_articles: 8
    discovery:
      method: htmlcrawl
      list_pages: ["/beauty"]
      link_pattern: "/beauty/content/"
    extraction:
      method: jsonld

  - key: beautyjournal
    name: Beauty Journal
    url: https://www.beautyjournal.id
    region: ID
    type: news
    trust_score: 0.5
    render: playwright
    max_articles: 8
    discovery:
      method: htmlcrawl
      list_pages: ["/"]
      link_pattern: "/article/"
    extraction:
      method: readability

  # --- Taiwan ---
  - key: marieclairetw
    name: Marie Claire Taiwan
    url: https://www.marieclaire.com.tw
    region: TW
    type: news
    trust_score: 0.5
    discovery:
      method: htmlcrawl
      list_pages: ["/beauty"]
      link_pattern: "/beauty/"
    extraction:
      method: readability
