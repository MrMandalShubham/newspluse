name: Daily Article Update

on:
  schedule:
    # Every day at 2:00 AM HKT (6:00 PM UTC previous day)
    - cron: '0 18 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install chromium
          playwright install-deps chromium

      - name: Run daily update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLISH_DATABASE_URL: ${{ secrets.PUBLISH_DATABASE_URL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          KLAVIYO_LIST_ID: ${{ secrets.KLAVIYO_LIST_ID }}
          APP_ENV: production
        run: python -m newspulse.feeds.weekly_update

      - name: Summary
        if: always()
        run: echo "Daily article update completed at $(date -u)"
