name: Article Update (2x daily)

on:
  schedule:
    # Run 1: ~02:37 SGT/HKT (18:37 UTC) — fresh for Asia morning + EU end-of-day
    - cron: '37 18 * * *'
    # Run 2: ~14:37 SGT/HKT (06:37 UTC) — fresh for US East morning + Asia lunch
    - cron: '37 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

concurrency:
  group: article-update
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install chromium
          playwright install-deps chromium

      - name: Run daily update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLISH_DATABASE_URL: ${{ secrets.PUBLISH_DATABASE_URL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          KLAVIYO_LIST_ID: ${{ secrets.KLAVIYO_LIST_ID }}
          APP_ENV: production
        run: python -m newspulse.feeds.weekly_update

      - name: Summary
        if: always()
        run: echo "Daily article update completed at $(date -u)"
