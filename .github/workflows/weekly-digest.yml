name: Weekly Digest Report

on:
  schedule:
    # Monday 20:00 UTC = Tuesday 04:00 HKT — after the daily article update
    - cron: '0 20 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Generate weekly digest
        env:
          PUBLISH_DATABASE_URL: ${{ secrets.PUBLISH_DATABASE_URL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          KLAVIYO_LIST_ID: ${{ secrets.KLAVIYO_LIST_ID }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          STORAGE_DIR: ./data/raw
          APP_ENV: production
        run: python -m newspulse.feeds.digest

      - name: Summary
        if: always()
        run: echo "Weekly digest generation completed at $(date -u)"
